name: CI

# Runs on every PR and push to main. No secrets are used, so it is safe for fork PRs:
# the example suite runs against the mock provider.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Run the basic example with the mock provider
        run: npm run eval -- run basic --dry-run --min-pass-rate 1
